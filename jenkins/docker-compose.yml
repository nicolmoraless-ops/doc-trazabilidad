services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # interfaz web de Jenkins
      - "50000:50000"   # agentes
      - "5000:5000"     # app desplegada por el stage Deploy
    volumes:
      - jenkins_home:/var/jenkins_home
volumes:
  jenkins_home:
